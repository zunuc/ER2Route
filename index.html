<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이터널리턴 2루트 계산기</title>
    <link rel="icon" href="img/icon.png" type="image/x-icon">
    
    <style>
        /* 기본 설정 및 데스크탑 스타일 */
        body { background-color: #3b3d3f; color: white; font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { margin-bottom: 40px; text-align: center; }
        .header img { height: 50px; vertical-align: middle; }
        .header span { font-size: 24px; font-weight: bold; margin-left: 10px; }
        
        /* 메인 레이아웃 */
        .main-layout { display: flex; gap: 30px; width: 100%; max-width: 1450px; justify-content: center; align-items: flex-start; }
        .column { display: flex; flex-direction: column; gap: 25px; flex: 1; }
        
        .title-wrapper { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; height: 25px; }
        .title { font-size: 18px; font-weight: bold; margin: 0; }
        .btn-action { background: #4a4c4e; color: #ccc; border: 1px solid #666; font-size: 12px; padding: 4px 10px; cursor: pointer; border-radius: 2px; }
        .btn-action:hover { background: #5a5c5e; color: white; }

        .grid-bg { background-color: #2a2c2e; padding: 10px; border-radius: 2px; border: 1px solid #4a4c4e; display: grid; gap: 5px; box-sizing: border-box; }
        .slot { width: 50px; height: 50px; background-color: #3e4144; border: 1px solid #555; display: flex; align-items: center; justify-content: center; cursor: pointer; box-sizing: border-box; position: relative; font-size: 11px; text-align: center; word-break: keep-all; }
        .slot img { width: 100%; height: 100%; object-fit: contain; }
        .slot.active { border: 2px solid #ff4655; background-color: #5a2e32; }
        .slot.selected { border: 2px solid #ffffff !important; }

        /* 그리드 배열 설정 */
        .type-grid, .weapon-grid { grid-template-columns: repeat(6, 50px); justify-content: center; width: 100%; }
        .candidate-grid { grid-template-columns: repeat(auto-fill, 50px); grid-auto-rows: 50px; min-height: 60px; width: 100%; align-content: start; }
        .all-items-grid { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); grid-auto-rows: 82px; max-height: 50vh; overflow-y: auto; padding-right: 10px; min-height: 350px; align-content: start; justify-content: start; }
        .all-items-grid .item-card { width: 100%; height: 82px; flex-direction: column; justify-content: flex-start; border-color: #754194; background: #352240; overflow: hidden; }
        .all-items-grid .item-card img { width: 54px; height: 54px; flex: 0 0 54px; border-bottom: 2px solid #b45cdb; }
        .all-items-grid .item-card .item-name { width: 100%; padding: 3px 2px; box-sizing: border-box; overflow: hidden; color: #f1defa; font-size: 10px; line-height: 13px; text-overflow: ellipsis; white-space: nowrap; }

        /* 4x2 스탯 슬롯 디자인 */
        .stat-grid { grid-template-columns: repeat(4, 1fr); width: 100%; justify-content: center; }
        .stat-slot {
            background-color: #3e4144; border: 1px solid #555; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-sizing: border-box; font-size: 12px; padding: 8px 4px; text-align: center; word-break: keep-all; height: 45px;
        }
        .stat-slot.active { border: 1px solid #ff4655; background-color: #5a2e32; color: #ffca28; font-weight: bold; }

        /* 요구치 필터 관련 */
        .requirement-container { display: flex; flex-direction: column; gap: 5px; width: 100%; min-height: 60px; }
        .filter-row { display: flex; gap: 5px; align-items: center; width: 100%; }
        .req-stat { background: #3e4144; color: white; border: 1px solid #555; padding: 4px; outline: none; flex: 1; }
        .req-val { background: #3e4144; color: white; border: 1px solid #555; padding: 4px; width: 70px; text-align: center; outline: none; }

        /* 결과 영역 (아코디언 UI 스타일 추가) */
        .result-section { width: 100%; max-width: 1450px; margin-top: 30px; border-top: 1px solid #555; padding-top: 20px; }
        .route-group-card { background: #2a2c2e; border: 1px solid #4a4c4e; margin-bottom: 15px; border-radius: 4px; overflow: hidden; }
        .route-group-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; cursor: pointer; background: #323538; user-select: none; }
        .route-group-header:hover { background: #3e4144; }
        .route-path { font-weight: bold; font-size: 18px; color: #ff4655; }
        
        .toggle-icon { font-size: 14px; margin-left: 15px; display: inline-block; transition: transform 0.3s; color: #aaa; }
        .toggle-icon.open { transform: rotate(180deg); color: white; }
        
        .route-details { padding: 15px; border-top: 1px solid #4a4c4e; display: none; background: #242628; max-height: 600px; overflow-y: auto; }
        .item-set-row { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed #444; }
        .item-set-row:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        
        .item-set-box { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .item-tag { background: #3e4144; padding: 4px 8px; border-radius: 3px; font-size: 12px; border: 1px solid #666; display: flex; align-items: center; gap: 5px; }
        .tag-auto { border-color: #bc58ff; color: #e0afff; background: #3b2a4a; }
        .missing-info { font-size: 13px; font-weight: bold; display: block; }
        
        .total-stats-box { margin-top: 5px; font-size: 13px; color: #ddd; background: #1a1c1e; padding: 8px; border-radius: 4px; border: 1px solid #333; }
        .total-stats-box span { display: inline-block; background: #333; padding: 2px 6px; border-radius: 3px; margin: 2px; }

        @media (max-width: 768px) {
            .main-layout { flex-direction: column; align-items: center; gap: 30px; }
            .column { width: 100%; align-items: center; }
            .type-grid, .weapon-grid { grid-template-columns: repeat(6, 1fr) !important; width: calc(100vw - 40px); gap: 5px !important; }
            .candidate-grid, .requirement-container { width: calc(100vw - 40px); }
            .all-items-grid { width: calc(100vw - 40px); grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); }
            .stat-grid { grid-template-columns: repeat(4, 1fr); width: calc(100vw - 40px); gap: 5px; }
            .slot { width: 100% !important; height: auto !important; aspect-ratio: 1 / 1 !important; }
            .result-section { width: calc(100vw - 40px); }
        }
        /* 아이템 툴팁 */
        .item-tooltip {
            position: fixed;
            display: none;
            z-index: 9999;

            min-width: 280px;
            max-width: 350px;

            background: rgba(18, 18, 30, 0.97);
            border-left: 4px solid #a855f7;

            padding: 14px;
            color: white;

            box-shadow: 0 0 15px rgba(0,0,0,0.7);
            pointer-events: none;
        }

        .item-tooltip-effect {
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .item-tooltip-header {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }

        .item-tooltip-header img {
            width: 64px;
            height: 64px;
            object-fit: contain;
        }

        .item-tooltip-name {
            font-size: 20px;
            font-weight: bold;
        }

        .item-tooltip-type {
            color: #b56cff;
            font-size: 14px;
            margin-top: 4px;
        }

        .item-tooltip-stats {
            margin-top: 8px;
        }

        .item-tooltip-stat {
            color: #45ff45;
            margin-bottom: 4px;
            font-size: 14px;
        }

        /* 지역으로 계산 화면 */
        .mode-button-stack { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
        .area-mode-button { background: #237aa2; border-color: #4eb3df; color: #fff; font-weight: bold; }
        .area-mode-button:hover { background: #3297c6; }
        .calculation-mode-row { width: min(1480px, 100%); display: flex; justify-content: flex-end; margin: -25px 0 20px; }
        .area-planner { display: none; position: relative; width: min(1480px, 100%); min-height: 720px; grid-template-columns: minmax(480px, 1.1fr) minmax(430px, .9fr); gap: 34px; align-items: start; }
        body.area-mode .main-layout, body.area-mode .result-section { display: none; }
        body.area-mode .area-planner { display: grid; }
        .map-column { display: flex; flex-direction: column; align-items: center; }
        .planner-heading { width: 100%; margin: 0 0 13px; padding: 12px 15px; box-sizing: border-box; background: rgba(20, 24, 31, .92); border-left: 3px solid #2d9ee0; color: #edf6ff; font-size: 17px; font-weight: bold; }
        .map-help { width: 100%; margin: 0 0 12px; color: #b9c4cd; font-size: 13px; }
        .map-frame { width: min(100%, 670px); position: relative; filter: drop-shadow(0 8px 20px rgba(0,0,0,.55)); }
        .satellite-map { display: block; width: 100%; height: auto; }
        .area-label { position: absolute; transform: translate(-50%, -50%); min-width: 54px; padding: 5px 8px; border: 1px solid rgba(230, 242, 248, .8); border-radius: 2px; background: rgba(11, 18, 25, .82); color: #fff; font-family: 'Malgun Gothic', sans-serif; font-size: 14px; font-weight: bold; text-align: center; white-space: nowrap; cursor: pointer; box-shadow: 0 1px 5px rgba(0,0,0,.75); transition: .15s ease; }
        .area-label:hover { border-color: #56c4f3; background: rgba(25, 94, 124, .94); transform: translate(-50%, -50%) scale(1.06); }
        .area-label.active { border-color: #98f25a; background: #2d7d25; color: #fff; box-shadow: 0 0 0 2px rgba(152,242,90,.22), 0 0 12px rgba(152,242,90,.8); }
        .area-label.active::after { content: '✓'; margin-left: 5px; color: #dbffbd; }
        .selected-area-list { width: 100%; min-height: 39px; padding: 7px 10px; box-sizing: border-box; background: rgba(21, 26, 32, .86); border: 1px solid #4b5661; color: #cbd6dd; font-size: 13px; }
        .selected-area-list b { color: #8fdbff; }
        .craft-panel { min-height: 590px; background: rgba(29, 34, 42, .94); border: 1px solid #48525d; box-shadow: 0 8px 25px rgba(0,0,0,.24); }
        .craft-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 17px; border-bottom: 1px solid #4a5662; background: rgba(20, 25, 31, .82); }
        .craft-panel-header h2 { margin: 0; font-size: 19px; }
        .area-weapon-filter { background: #303a45; border: 1px solid #6186a1; color: #edf7ff; padding: 6px 8px; border-radius: 2px; font-family: inherit; font-size: 12px; }
        .craft-count { color: #8fdbff; font-size: 13px; }
        .empty-craft { padding: 80px 25px; color: #aeb8c1; text-align: center; line-height: 1.8; }
        .craft-group { padding: 12px 14px 4px; }
        .craft-group-title { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; padding: 9px 10px; background: #242b34; border-left: 3px solid #288bc1; font-weight: bold; }
        .craft-group-title img { width: 27px; height: 27px; object-fit: contain; }
        .craft-items { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 4px 10px; }
        .craft-item { width: 58px; min-height: 78px; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; color: #dbe5ed; font-size: 10px; text-align: center; cursor: default; }
        .craft-item img { width: 52px; height: 52px; object-fit: contain; background: #29252f; border-bottom: 3px solid #a657d1; }
        .craft-item span { max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .craft-item.near-craft img { background: #243e3e; border-bottom-color: #30c6a1; }
        .craft-item.near-craft span { color: #b8f4e3; }
        .missing-material-badge { position: absolute; z-index: 1; top: -6px; right: -6px; width: 28px !important; height: 28px !important; padding: 2px; box-sizing: border-box; border: 1px solid #d8f6ee; border-radius: 50%; background: #163b35 !important; object-fit: contain; }
        .near-craft-toggle { width: 54px; height: 54px; margin: 0; padding: 0; border: 1px dashed #3ad4b0; background: #1c3b3c; color: #91f6dc; font-size: 26px; line-height: 1; cursor: pointer; }
        .near-craft-toggle:hover { background: #285d59; color: #fff; }
        .near-craft-toggle:disabled { border-color: #59656a; background: #30373a; color: #778286; cursor: not-allowed; }
        .near-craft-note { width: 100%; margin: 2px 0 0; color: #7ce1c5; font-size: 11px; }

        #itemSearch { box-sizing: border-box; width: 100%; min-height: 62px; padding: 12px 18px; background: #292c2e; color: white; border: 1px solid #62676c; border-radius: 3px; font: inherit; }
        #itemSearch:focus { outline: 2px solid #21b9eb; outline-offset: -2px; }
        #itemSearch::placeholder { color: #b6bdc2; }
        .legendary-result, .search-empty { grid-column: 1 / -1; padding: 8px; font-size: 13px; }
        .legendary-result { background: #302d28; color: #e7d3a3; }
        .legendary-result summary { cursor: pointer; }
        .legendary-result p { color: #ddd; white-space: pre-line; }
        .all-items-grid:has(.legendary-result) { grid-auto-rows: auto; }
        @media (min-width: 769px) {
            body:not(.area-mode) .items-column { height: var(--filter-column-height); }
            body:not(.area-mode) #allItemsDisplay { flex: 1 1 0; min-height: 0; max-height: none; overflow-y: auto; overscroll-behavior-y: contain; scrollbar-gutter: stable; }
        }
        /* 아이템으로 계산: backup.html의 기본 레이아웃 + 소제목 배경 */
        body:not(.area-mode) .header { width: auto; margin-bottom: 40px; padding: 0; border: 0; text-align: center; }
        body:not(.area-mode) .header img { height: 50px; }
        body:not(.area-mode) .header span { color: white; font-size: 24px; letter-spacing: normal; }
        body:not(.area-mode) .main-layout { gap: 30px; max-width: 1450px; align-items: flex-start; }
        body:not(.area-mode) .stats-column { max-width: 360px; }
        body:not(.area-mode) .candidates-column { max-width: 350px; }
        body:not(.area-mode) .items-column { max-width: 600px; }
        body:not(.area-mode) .main-layout > .column { min-width: auto; padding: 0; border: 0; background: transparent; box-shadow: none; }
        body:not(.area-mode) .main-layout > .column > div { margin-bottom: 0; }
        body:not(.area-mode) .title-wrapper { height: 42px; min-height: 0; margin: 0 0 12px; padding: 0 10px; box-sizing: border-box; border-left: 3px solid #21b9eb; background: #1d242a; }
        body:not(.area-mode) .title { color: white; font-size: 18px; }
        body:not(.area-mode) .btn-action { border-color: #666; background: #4a4c4e; color: #ccc; }
        body:not(.area-mode) .btn-action:hover { border-color: #666; background: #5a5c5e; color: white; }
        body:not(.area-mode) .grid-bg { border-color: #4a4c4e; background: #2a2c2e; border-radius: 2px; }
        body:not(.area-mode) .type-grid, body:not(.area-mode) .weapon-grid { grid-template-columns: repeat(6, 50px); justify-content: center; padding: 10px; }
        body:not(.area-mode) .type-grid .slot, body:not(.area-mode) .weapon-grid .slot { width: 50px; height: 50px; aspect-ratio: auto; }
        body:not(.area-mode) .slot { border-color: #555; background: #3e4144; }
        body:not(.area-mode) .slot.active { border-color: #ff4655; background: #5a2e32; }
        body:not(.area-mode) .all-items-grid { min-height: 350px; max-height: 50vh; }
        body:not(.area-mode) .candidate-grid { min-height: 60px; }
        body:not(.area-mode) .candidates-column > .title-wrapper, body:not(.area-mode) .items-column > .title-wrapper { width: 100%; }
        body:not(.area-mode) .result-section { margin-top: 30px; padding: 20px 0 0; border: 0; border-top: 1px solid #555; background: transparent; box-shadow: none; }
        @media (max-width: 768px) {
            body:not(.area-mode) .main-layout { flex-direction: column; align-items: center; gap: 30px; }
            body:not(.area-mode) .column { width: 100%; align-items: center; }
            body:not(.area-mode) .stats-column, body:not(.area-mode) .candidates-column, body:not(.area-mode) .items-column { max-width: 100%; }
            body:not(.area-mode) .type-grid, body:not(.area-mode) .weapon-grid { grid-template-columns: repeat(6, 1fr); width: calc(100vw - 40px); gap: 5px; }
            body:not(.area-mode) .candidate-grid, body:not(.area-mode) .requirement-container { width: calc(100vw - 40px); }
            body:not(.area-mode) .all-items-grid { width: calc(100vw - 40px); grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); }
            body:not(.area-mode) .all-items-grid .item-card { height: 82px !important; aspect-ratio: auto !important; }
            body:not(.area-mode) .stat-grid { grid-template-columns: repeat(4, 1fr); width: calc(100vw - 40px); gap: 5px; }
            body:not(.area-mode) .slot { width: 100% !important; height: auto !important; aspect-ratio: 1 / 1 !important; }
            body:not(.area-mode) .result-section { width: calc(100vw - 40px); }
        }
        @media (max-width: 950px) { .area-planner { grid-template-columns: 1fr; } .map-column { order: 1; } .craft-panel { order: 2; } }
        @media (max-width: 768px) { .area-planner { width: calc(100vw - 40px); } .area-label { font-size: 10px; min-width: 38px; padding: 3px 4px; } .calculation-mode-row { width: calc(100vw - 40px); } .mode-button-stack { flex-direction: row-reverse; } }

    </style>
    <link rel="stylesheet" href="comparison.css">
</head>
<body>

    <div class="header">
        <img src="img/logo__white.png" alt="Logo" onerror="this.style.display='none'">
        <span>2루트 계산기</span>
    </div>
    <div class="calculation-mode-row">
        <button class="btn-action area-mode-button" id="calculationModeButton" onclick="toggleCalculationMode()">지역으로 계산</button>
    </div>

    <div class="main-layout">
        <div class="column stats-column">
            <div>
                <div class="title-wrapper">
                    <h2 class="title">보유 스탯</h2>
                    <button class="btn-action" id="statConditionToggle" onclick="toggleStatCondition()">조건: OR</button>
                </div>
                <div class="grid-bg stat-grid" id="statFilters"></div>
            </div>
            <div>
                <div class="title-wrapper"><h2 class="title">부위</h2></div>
                <div class="grid-bg type-grid" id="typeFilters">
                    <div class="slot active" id="type-all" onclick="setTypeFilter('all', this)">ALL</div>
                    <div class="slot" onclick="setTypeFilter('weapon', this)"><img src="img/부위/weapon.png" onerror="this.style.display='none'"></div>
                    <div class="slot" onclick="setTypeFilter('Cheat', this)"><img src="img/부위/chest.png" onerror="this.style.display='none'"></div>
                    <div class="slot" onclick="setTypeFilter('Head', this)"><img src="img/부위/head.png" onerror="this.style.display='none'"></div>
                    <div class="slot" onclick="setTypeFilter('Arm', this)"><img src="img/부위/arm.png" onerror="this.style.display='none'"></div>
                    <div class="slot" onclick="setTypeFilter('leg', this)"><img src="img/부위/leg.png" onerror="this.style.display='none'"></div>
                </div>
            </div>
            <div>
                <div class="title-wrapper"><h2 class="title">무기군</h2></div>
                <div class="grid-bg weapon-grid" id="weaponFilters">
                    <div class="slot active" id="weapon-all" onclick="setWeaponFilter('all', this)">ALL</div>
                    <div class="slot" onclick="setWeaponFilter('Glove', this)"><img src="img/무기 종류/대표 이미지/01. Glove.png"></div>
                    <div class="slot" onclick="setWeaponFilter('Tonfa', this)"><img src="img/무기 종류/대표 이미지/02. Tonfa.png"></div>
                    <div class="slot" onclick="setWeaponFilter('Bat', this)"><img src="img/무기 종류/대표 이미지/03. Bat.png"></div>
                    <div class="slot" onclick="setWeaponFilter('Hammer', this)"><img src="img/무기 종류/대표 이미지/04. Hammer.png"></div>
                    <div class="slot" onclick="setWeaponFilter('Whip', this)"><img src="img/무기 종류/대표 이미지/05. Whip.png"></div>
                    <div class="slot" onclick="setWeaponFilter('Throwing', this)"><img src="img/무기 종류/대표 이미지/06. Throwing.png"></div>
                    <div class="slot" onclick="setWeaponFilter('Shuriken', this)"><img src="img/무기 종류/대표 이미지/07. Shuriken.png"></div>
                    <div class="slot" onclick="setWeaponFilter('Bow', this)"><img src="img/무기 종류/대표 이미지/08. Bow.png"></div>
                    <div class="slot" onclick="setWeaponFilter('Crossbow', this)"><img src="img/무기 종류/대표 이미지/09. Crossbow.png"></div>
                    <div class="slot" onclick="setWeaponFilter('Pistol', this)"><img src="img/무기 종류/대표 이미지/10. Pistol.png"></div>
                    <div class="slot" onclick="setWeaponFilter('Assault Rifle', this)"><img src="img/무기 종류/대표 이미지/11. Assault Rifle.png"></div>
                    <div class="slot" onclick="setWeaponFilter('Sniper Rifle', this)"><img src="img/무기 종류/대표 이미지/12. Sniper Rifle.png"></div>
                    <div class="slot" onclick="setWeaponFilter('Axe', this)"><img src="img/무기 종류/대표 이미지/13. Axe.png"></div>
                    <div class="slot" onclick="setWeaponFilter('Dagger', this)"><img src="img/무기 종류/대표 이미지/14. Dagger.png"></div>

            const tooltip = document.getElementById("itemTooltip");
            const gap = 18;
            const maxLeft = window.innerWidth - tooltip.offsetWidth - 8;
            const left = Math.max(8, Math.min(event.clientX + gap, maxLeft));
            const below = event.clientY + gap;
            const top = below + tooltip.offsetHeight > window.innerHeight - 8
                ? Math.max(8, event.clientY - tooltip.offsetHeight - gap)
                : below;
            tooltip.style.left = left + "px";
            tooltip.style.top = top + "px";
        }

                fields.push(label + value, label + "+" + value);
                for (const [stat, aliases] of Object.entries(searchStatAliases)) {

            searchIndex.set(item, fields.map(compact));

                        for (let s of selectedStats) {

                            if (!equivs.some(eq => itemStats.includes(eq))) return false;
                        }
                    }
                }
                return true;
            });

                div.innerHTML = `

                         onerror="this.style.display='none';
                         this.parentElement.querySelector('.item-name').style.display='block';">
                    <span class="item-name" title="${item.name}">${item.name}</span>
                `;

                display.appendChild(div);

            for (const item of legendary) {
                const row = document.createElement('details');
                row.className = 'legendary-result';

        function getRequirements() {
            const reqs = [];
            document.querySelectorAll('#requirementContainer .filter-row').forEach(row => {
                const stat = row.querySelector('.req-stat').value;
                const type = row.querySelector('.req-type').value; // 이상(min)인지 이하(max)인지 판별
                const valStr = row.querySelector('.req-val').value;
                
                // 값이 비어있지 않으면 배열에 추가 (0도 입력 가능하도록 수정)
                if (valStr !== '') {
                    reqs.push({ stat, type, val: parseFloat(valStr) });
                }
            });
            return reqs;
        }

        // 재귀를 이용한 다중 배열 조합(경우의 수) 생성 함수
        function getCombinations(options) {
            if (options.length === 0) return [[]];
            let result = [];
            let rest = getCombinations(options.slice(1));
            for (let item of options[0]) {
                for (let r of rest) {
                    result.push([item, ...r]);
                }
            }
            return result;
        }

function startRouteCalculation() {
    const selectedList = Array.from(selectedItems).map(name => allItems.find(i => i.name === name));
    if (selectedList.length === 0) {
        alert("후보군에 아이템을 하나 이상 추가해주세요.");
        return;
    }

    let userChoices = { weapon: [], Cheat: [], Head: [], Arm: [], leg: [] };
    selectedList.forEach(it => {
        let t = it.type;
        if (t && t.toLowerCase() === 'weapon') t = 'weapon';
        if (userChoices[t] !== undefined) {
            userChoices[t].push(it);
        }
    });

    if (userChoices.weapon.length === 0) {
        alert("무기를 최소 1개 이상 후보군에 추가해주세요.");
        return;
    }

    // 1. 유저가 선택한 후보군으로 만들 수 있는 '모든 경우의 수(아이템 조합)'를 미리 생성 (기존 로직 복구)
    const activeSlots = Object.keys(userChoices).filter(s => userChoices[s].length > 0);
    const missingSlots = Object.keys(userChoices).filter(s => userChoices[s].length === 0);

    const getUserCombos = (idx) => {
        if (idx === activeSlots.length) return [[]];
        const res = [], slot = activeSlots[idx], sub = getUserCombos(idx + 1);
        userChoices[slot].forEach(it => sub.forEach(s => res.push([it, ...s])));
        return res;
    };
    const userCombos = getUserCombos(0);

    // 재료 부족분 계산 함수 (유지)
    function calculateMissCount(itemList, availableMats) {
        let reqGlass = 0, reqGold = 0;
        let missingCounts = {};
        
        for (let i = 0; i < itemList.length; i++) {
            let it = itemList[i];
            if (!it) continue;
            
            let hasGlass = it.useGlass ? 1 : 0;
            let hasGold = (it.useGold || it.useStone) ? 1 : 0;
            
            if (it.materials) {
                for (let j = 0; j < it.materials.length; j++) {
                    let m = it.materials[j];
                    if (hasGold && (m === "원석" || m === "곡괭이")) continue;
                    
                    if (!availableMats.has(m)) {
                        missingCounts[m] = (missingCounts[m] || 0) + 1;
                    }
                }
            }
            reqGlass += hasGlass;
            reqGold += hasGold;
        }
        
        let glassSets = Math.ceil(reqGlass / 2);
        let goldSets = Math.ceil(reqGold / 2);
        
        for (let i = 0; i < goldSets; i++) {
            if (!availableMats.has("원석")) missingCounts["원석"] = (missingCounts["원석"] || 0) + 1;
            if (!availableMats.has("곡괭이")) missingCounts["곡괭이"] = (missingCounts["곡괭이"] || 0) + 1;
        }
        for (let k = 0; k < glassSets; k++) {
            if (!availableMats.has("유리병")) missingCounts["유리병"] = (missingCounts["유리병"] || 0) + 1;
        }
        
        let effectiveMiss = 0;
        let missingArr = [];
        for (let m in missingCounts) {
            missingArr.push(m);
            if (m === "고철" || m === "꽃") effectiveMiss += Math.ceil(missingCounts[m] / 2);
            else effectiveMiss += missingCounts[m];
        }
        
        return { count: effectiveMiss, mats: missingArr };
    }

    const areaNames = Object.keys(areaData);
    let results = [];
    const reqs = getRequirements();

    // 지역 순회 시작
    for (let i = 0; i < areaNames.length; i++) {
        for (let j = 0; j < areaNames.length; j++) {
            if (i === j) continue;
            const aName = areaNames[i];
            const bName = areaNames[j];
            
            const isNear = areaData[aName].near && areaData[aName].near.includes(bName);
            const hasLoop = areaData[aName].hasLoop === true;
            
            if (!isNear && !hasLoop) continue;

            const availableMats = new Set([...areaData[aName].items, ...areaData[bName].items]);
            const isDebugTarget = (aName === "주유소" && bName === "양궁장");
            
            if (isDebugTarget) {
                console.log(`\n🔎 [%c${aName} ➔ ${bName}%c] 경로 정밀 추적 시작`, "color: #ff4655; font-weight: bold;", "");
            }

            let validCombinationsForThisRoute = [];

            // 2. 미리 만들어둔 '유저 아이템 조합(userCombos)'을 하나씩 꺼내서 검사
            for (let uIdx = 0; uIdx < userCombos.length; uIdx++) {
                let currentCombo = userCombos[uIdx];

                // 1차 관문: '현재 조합'이 이 2루트에서 재료가 2개 이상 부족한지 확인
                let myChoiceMissInfo = calculateMissCount(currentCombo, availableMats);
                
                if (isDebugTarget && uIdx === 0) {
                    console.log(`👉 1. 첫 번째 유저 조합(${currentCombo.map(i=>i.name).join(', ')}) 부족 재료: ${myChoiceMissInfo.count}개`);
                }

                if (myChoiceMissInfo.count >= 2) continue; // 이 조합은 불가능하므로 다음 조합으로 넘어감

                let slotOptions = { weapon: [], Cheat: [], Head: [], Arm: [], leg: [] };
                let pathValid = true;

                // 유저가 고른 슬롯은 해당 아이템으로 고정
                activeSlots.forEach(slot => {
                    let itemForSlot = currentCombo.find(it => {
                        let t = it.type && it.type.toLowerCase() === 'weapon' ? 'weapon' : it.type;
                        return t === slot;
                    });
                    slotOptions[slot] = [itemForSlot];
                });

                // 빈 슬롯은 자동 완성 후보군 찾기
                for (let mIdx = 0; mIdx < missingSlots.length; mIdx++) {
                    let slot = missingSlots[mIdx];
                    let candidates = allItems.filter(item => {
                        let itType = item.type && item.type.toLowerCase() === 'weapon' ? 'weapon' : item.type;
                        if (itType !== slot || !item.materials) return false;
                        if (item.roles && item.roles.includes("전용")) return false;
                        
                        let missInfo = calculateMissCount([item], availableMats);
                        return missInfo.count === 0;
                    });
                    
                    if (candidates.length === 0) {
                        pathValid = false;
                        break; // 빈 슬롯을 채울 아이템이 하나도 없으면 이 조합은 무효화
                    }
                    slotOptions[slot] = candidates;
                }

                if (!pathValid) continue;

                // 현재 조합과 빈 슬롯 후보군을 합쳐 최종 5부위 생성
                let optionsArray = [
                    slotOptions.weapon,
                    slotOptions.Cheat,
                    slotOptions.Head,
                    slotOptions.Arm,
                    slotOptions.leg
                ];
                
                let allCombinations = getCombinations(optionsArray);

                for (let combo of allCombinations) {
                    let comboMissInfo = calculateMissCount(combo, availableMats);
                    if (comboMissInfo.count >= 2) continue;

                    let allMatsCount = {};
                    let reqGl = 0, reqGo = 0;
                    let totals = {};
                    let nonWeaponTotals = {};

                    combo.forEach(it => {
                        let hasGo = (it.useGold || it.useStone) ? 1 : 0;
                        if (it.materials) {
                            it.materials.forEach(m => {
                                if (hasGo && (m === "원석" || m === "곡괭이")) return;
                                allMatsCount[m] = (allMatsCount[m] || 0) + 1;
                            });
                        }
                        if (it.useGlass) reqGl++;
                        if (hasGo) reqGo++;

                        if (it.stats) {
                            const isWeapon = (it.type && it.type.toLowerCase() === 'weapon');
                            for (let k in it.stats) {
                                totals[k] = (totals[k] || 0) + it.stats[k];
                                if (!isWeapon) {
                                    nonWeaponTotals[k] = (nonWeaponTotals[k] || 0) + it.stats[k];
                                }
                            }
                        }
                    });
                    
                    let glSets = Math.ceil(reqGl / 2);
                    let goSets = Math.ceil(reqGo / 2);
                    if (glSets > 0) allMatsCount["유리병"] = (allMatsCount["유리병"] || 0) + glSets;
                    if (goSets > 0) {
                        allMatsCount["원석"] = (allMatsCount["원석"] || 0) + goSets;
                        allMatsCount["곡괭이"] = (allMatsCount["곡괭이"] || 0) + goSets;
                    }

                    let warningMats = [];
                    for (let m in allMatsCount) {
                        let limit = (m === "고철" || m === "꽃") ? 8 : 4;
                        if (allMatsCount[m] >= limit) warningMats.push(m);
                    }
                    let warningMsg = warningMats.length > 0 ? `⚠️ 동일 재료 과다(${warningMats.join(', ')})` : "";

                    // 스탯 필터링 검증
                    let pass = true;
                    for (let req of reqs) {
                        if (req.type === 'min') {
                            let statVal = totals[req.stat] || 0;
                            if (statVal < req.val) { pass = false; break; }
                        } else {
                            let statVal = nonWeaponTotals[req.stat] || 0;
                            if (statVal > req.val) { pass = false; break; }

                            if (req.val <= 0) {
                                const scalingMap = { 'ad': 'lvad', 'sk': 'lvsk', 'hp': 'lvhp' };
                                let sStat = scalingMap[req.stat];
                                if (sStat && (nonWeaponTotals[sStat] || 0) > 0) {
                                    pass = false;
                                    break;
                                }
                            }
                        }
                    }
                    
                    if (pass) {
                        let selectedInCombo = [];
                        let autoInCombo = [];
                        
                        combo.forEach(item => {
                            if (selectedList.some(s => s.name === item.name)) {
                                selectedInCombo.push(item);
                            } else {
                                autoInCombo.push(item);
                            }
                        });

                        validCombinationsForThisRoute.push({
                            selectedItems: selectedInCombo,
                            autoItems: autoInCombo,
                            totalStats: totals,
                            comboMissCount: comboMissInfo.count,
                            comboMissingMats: Array.from(new Set(comboMissInfo.mats)),
                            warningMsg: warningMsg
                        });
                    }
                }
            } // 유저 조합(userCombos) 순회 끝

            if (isDebugTarget) {
                console.log(`👉 2. 이 경로의 최종 유효 조합 개수: ${validCombinationsForThisRoute.length}개`);
            }

            if (validCombinationsForThisRoute.length > 0) {
                let bestCombo = validCombinationsForThisRoute.reduce((prev, curr) => prev.comboMissCount < curr.comboMissCount ? prev : curr);
                results.push({
                    path: [aName, bName],
                    validCombinations: validCombinationsForThisRoute,
                    missCount: bestCombo.comboMissCount,
                    missingMats: bestCombo.comboMissingMats
                });
            }
        }
    }

    results.sort((a, b) => a.missCount - b.missCount);
    renderResults(results.slice(0, 20));
}

        function toggleRoute(index) {
            const details = document.getElementById(`details-${index}`);
            const icon = document.getElementById(`icon-${index}`);
            if (details.style.display === 'none' || details.style.display === '') {
                details.style.display = 'block';
                icon.classList.add('open');
            } else {
                details.style.display = 'none';
                icon.classList.remove('open');
            }
        }

                container.innerHTML = '<div style="padding: 20px;">조건을 만족하는 2루트 결과가 없습니다.</div>';
                return;
            }

            results.forEach((res, index) => {
                let missingInfoHtml = res.missCount > 0 
                    ? `<span class="missing-info" style="color:#ff6b6b;">부족한 재료 ${res.missingMats.join(', ')} (${res.missCount}개)</span>`
                    : `<span class="missing-info" style="color:#4caf50;">모든 재료 확보 가능!</span>`;

                let html = `

                res.validCombinations.sort((a, b) => {

                    }
                    let sumA = Object.values(a.totalStats).reduce((acc, v) => acc + v, 0);
                    let sumB = Object.values(b.totalStats).reduce((acc, v) => acc + v, 0);
                    return sumB - sumA;
                });

                const displayCombos = res.validCombinations.slice(0, 50);

                        : `<span style="color:#4caf50; font-size:12px; margin-left:10px;">(재료 완성)</span>`;
                        
                    // [신규] 경고 메시지가 있을 경우 배달 아이템 텍스트 옆에 주황색으로 출력
                    let warningHtml = comboInfo.warningMsg 
                        ? `<span style="color:#ff9800; font-size:12px; margin-left:5px; font-weight:bold;">${comboInfo.warningMsg}</span>`
                        : ``;
                        
                    let totalStatsHtml = `<div class="total-stats-box"><strong>총합 스탯 ➔ </strong> ${statStrings.length > 0 ? statStrings.join(' ') : '없음'} ${comboMissHtml} ${warningHtml}</div>`;

                    html += `
                        <div class="item-set-row">
                            <div class="item-set-box">
                    `;

                    comboInfo.selectedItems.forEach(it => {
                        html += `
                            <div class="item-tag">
                                <img src="${it.image}" style="width:20px; height:20px; object-fit:contain;" onerror="this.style.display='none'">
                                <span>${it.name}</span>
                            </div>
                        `;
                    });

                    comboInfo.autoItems.forEach(autoItem => {
                        html += `
                            <div class="item-tag tag-auto">
                                <img src="${autoItem.image}" style="width:20px; height:20px; object-fit:contain;" onerror="this.style.display='none'">
                                <span>${autoItem.name} (추천)</span>
                            </div>
                        `;
                    });

                    const gear = [...comboInfo.selectedItems, ...comboInfo.autoItems].map(item => allItems.indexOf(item));
                    html += `<button class="btn-action register-set" data-gear="${gear.join(',')}">스탯 비교 후보군 등록</button></div>${totalStatsHtml}</div>`;
                });

                if (res.validCombinations.length > 50) {
                    html += `<div style="text-align: center; padding-top: 10px; color: #888; font-size: 12px;">외 ${res.validCombinations.length - 50}개의 조합이 더 있습니다...</div>`;
                }

                html += `</div></div>`;
                container.innerHTML += html;
            });
        }

        // 지역 선택 화면: 지도 원본의 좌표 비율에 맞춰 라벨을 배치한다.
        const mapAreaPositions = [

            'Rapier': '레이피어', 'Guitar': '기타', 'Camera': '카메라', 'Arcana': '아르카나', 'VF Prosthetic': 'VF의수'
        };
        const weaponGroupOrder = ['Glove', 'Tonfa', 'Bat', 'Hammer', 'Whip', 'Throwing', 'Shuriken', 'Bow', 'Crossbow', 'Pistol', 'Assault Rifle', 'Sniper Rifle', 'Axe', 'Dagger', 'Twohanded Sword', 'Dual Sword', 'Spear', 'Nunchaku', 'Rapier', 'Guitar', 'Camera', 'Arcana', 'VF Prosthetic'];
        const selectedAreas = new Set();
        let areaWeaponFilter = 'all';
        const expandedNearCraftTypes = new Set();

        function toggleCalculationMode() {
            const enabled = document.body.classList.toggle('area-mode');
            document.getElementById('calculationModeButton').textContent = enabled ? '아이템으로 계산' : '지역으로 계산';
            if (enabled) renderCraftableItems();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function initAreaMap() {
            const frame = document.getElementById('mapFrame');
            mapAreaPositions.forEach(([name, left, top]) => {
                const label = document.createElement('button');
                label.type = 'button';
                label.className = 'area-label';
                label.dataset.area = name;
                label.textContent = name;
                label.style.left = `${left}%`;
                label.style.top = `${top}%`;
                label.addEventListener('click', () => toggleArea(name));
                frame.appendChild(label);
            });
            const weaponFilter = document.getElementById('areaWeaponFilter');
            const availableWeaponGroups = new Set(allItems.filter(item => item.type === 'weapon').map(item => item.weaponGroup));
            weaponGroupOrder
                .filter(group => availableWeaponGroups.has(group))
                .forEach(group => weaponFilter.insertAdjacentHTML('beforeend', `<option value="${group}">${weaponGroupKoreanNames[group] || group}</option>`));
            renderCraftableItems();
        }

        function setAreaWeaponFilter(group) {
            areaWeaponFilter = group;
            renderCraftableItems();
        }

        function toggleNearCraft(type) {
            if (expandedNearCraftTypes.has(type)) expandedNearCraftTypes.delete(type);
            else expandedNearCraftTypes.add(type);
            renderCraftableItems();
        }

        function toggleArea(areaName) {
            if (selectedAreas.has(areaName)) selectedAreas.delete(areaName);
            else selectedAreas.add(areaName);
            document.querySelector(`[data-area="${areaName}"]`).classList.toggle('active', selectedAreas.has(areaName));
            expandedNearCraftTypes.clear();
            renderCraftableItems();
        }

        function renderCraftableItems() {
            const result = document.getElementById('craftResults');
            const count = document.getElementById('craftCount');
            const selectedList = document.getElementById('selectedAreaList');
            const areaNames = [...selectedAreas];
            selectedList.innerHTML = areaNames.length
                ? `<b>선택 지역 (${areaNames.length})</b> · ${areaNames.join(', ')}`
                : '선택된 지역이 없습니다.';

            if (!areaNames.length) {
                count.textContent = '지역을 선택하세요';
                result.innerHTML = '<div class="empty-craft">지도에서 지역 이름을 선택하면<br>해당 지역의 재료만으로 제작 가능한 장비가 표시됩니다.</div>';
                return;
            }

            const availableMaterials = new Set(areaNames.flatMap(name => areaData[name].items));
            const isAllowedItem = item =>
                item.name !== '만개하는 선율' &&
                (item.type !== 'weapon' || areaWeaponFilter === 'all' || item.weaponGroup === areaWeaponFilter);
            const getMissingMaterials = item => (item.materials || []).filter(material => !availableMaterials.has(material));
            const craftable = allItems.filter(item => isAllowedItem(item) && getMissingMaterials(item).length === 0);
            const nearCraftable = allItems.filter(item => isAllowedItem(item) && getMissingMaterials(item).length === 1);
            count.textContent = `${craftable.length}개 제작 가능`;

            if (!craftable.length && !nearCraftable.length) {
                result.innerHTML = '<div class="empty-craft">선택한 지역의 재료만으로는 제작 가능한 장비가 없습니다.<br>다른 지역을 추가로 선택해 보세요.</div>';
                return;
            }

            result.innerHTML = '';
            craftTypeOrder.forEach(type => {
                const items = craftable.filter(item => item.type === type).sort((a, b) => a.name.localeCompare(b.name, 'ko'));
                const nearItems = nearCraftable.filter(item => item.type === type).sort((a, b) => a.name.localeCompare(b.name, 'ko'));
                if (!items.length && !nearItems.length) return;
                const group = document.createElement('section');
                group.className = 'craft-group';
                group.innerHTML = `<div class="craft-group-title"><img src="${craftTypeIcons[type]}" alt=""><span>${typeNames[type]}</span><small>(${items.length})</small></div><div class="craft-items"></div>`;
                const itemContainer = group.querySelector('.craft-items');
                items.forEach(item => {
                    itemContainer.appendChild(createCraftItemCard(item));
                });
                const moreButton = document.createElement('button');
                moreButton.type = 'button';
                moreButton.className = 'near-craft-toggle';
                moreButton.textContent = expandedNearCraftTypes.has(type) ? '−' : '+';
                moreButton.title = nearItems.length ? `재료 1개가 부족한 ${nearItems.length}개 장비 보기` : '재료 1개 부족 장비 없음';
                moreButton.disabled = nearItems.length === 0;
                moreButton.addEventListener('click', () => toggleNearCraft(type));
                itemContainer.appendChild(moreButton);
                if (expandedNearCraftTypes.has(type)) {
                    nearItems.forEach(item => itemContainer.appendChild(createCraftItemCard(item, getMissingMaterials(item)[0])));
                    const note = document.createElement('div');
                    note.className = 'near-craft-note';
                    note.textContent = `추가 표시: 재료 1개만 더 있으면 제작 가능한 장비 ${nearItems.length}개`;
                    itemContainer.appendChild(note);
                }
                result.appendChild(group);
            });
        }

        function createCraftItemCard(item, missingMaterial = null) {
            const card = document.createElement('div');
            card.className = `craft-item${missingMaterial ? ' near-craft' : ''}`;
            card.innerHTML = `<img src="${item.image}" alt="${item.name}"><span title="${item.name}">${item.name}</span>`;
            if (missingMaterial) {
                const badge = document.createElement('img');
                badge.className = 'missing-material-badge';
                badge.src = `img/재료/${missingMaterial}.png`;
                badge.alt = `${missingMaterial} 부족`;
                badge.title = `부족한 재료: ${missingMaterial}`;
                badge.onerror = () => { badge.style.display = 'none'; };
                card.appendChild(badge);
            }
            if (!isMobile()) {
                card.addEventListener('mouseenter', event => showTooltip(item, event));
                card.addEventListener('mousemove', moveTooltip);
                card.addEventListener('mouseleave', hideTooltip);
            }
            return card;
        }

        const filterColumn = document.querySelector('.stats-column');
        const itemsColumn = document.querySelector('.items-column');
        new ResizeObserver(() => {
            const height = filterColumn.getBoundingClientRect().height;
            if (height > 0) itemsColumn.style.setProperty('--filter-column-height', height + 'px');
        }).observe(filterColumn);

        window.onload = () => {
            initStats();
            initAreaMap();
        };
    </script>
<div id="itemTooltip" class="item-tooltip"></div>
<section id="comparison" aria-label="아이템 스탯 비교">
    <h1>아이템 스탯 비교</h1>
    <div class="compare-layout">
        <section class="character-panel"><h2>실험체 선택</h2>
            <input type="search" id="characterQuery" aria-label="실험체 검색" placeholder="실험체 이름, 무기, 줄임말 검색">
            <div id="characters" class="compare-picker"></div>

</section>
        <section><div class="compare-heading"><h2>장비 세트</h2><button id="newSet">세트 추가</button></div>
            <div id="setTabs"></div><div id="equipped"></div>
            <div class="compare-heading"><h3>장비 선택</h3><select id="compareRarity" aria-label="장비 등급"><option>전체 등급</option><option>영웅</option><option>전설</option></select></div>
            <input id="gearQuery" type="search" placeholder="장비 이름, 스탯, 고유 옵션 검색" aria-label="장비 검색">
            <div id="gearPicker" class="compare-picker"></div>
        </section>
        <section class="adjustment-panel"><h2>추가 수치</h2><div id="adjustmentFields"></div></section>
        <section class="totals-panel"><div class="compare-heading"><h2>상세 스탯</h2><button id="showBaseStats" aria-haspopup="dialog">기본 스탯 확인</button><label class="level-control">캐릭터 레벨 <select id="compareLevel"></select></label></div><small>무기 숙련도는 캐릭터 레벨과 같습니다.</small><div id="characterTotals"></div></section>
    </div>
    <dialog id="baseStatDialog" aria-labelledby="baseStatTitle">
        <div class="compare-heading"><h2 id="baseStatTitle">기본 스탯</h2><form method="dialog"><button autofocus>닫기</button></form></div>
        <table><thead><tr><th>항목</th><th>레벨 스탯(LV.1)</th><th>성장치</th></tr></thead><tbody id="baseStatRows"></tbody></table>
    </dialog>
    <section id="setDifferences" hidden></section>
    <section id="skillComparison"><h2>스킬 상세</h2>
        <div class="skill-controls">
            <label id="skillConditionLabel" hidden><span></span> <input id="skillCondition" type="number" min="0" step="1" value="0"></label>
        </div>
        <div id="skillOutput"></div>
    </section>
</section>
<button id="compareToggle" aria-controls="comparison" aria-expanded="false">아이템 스탯 비교</button>
<script src="comparison-data.js"></script>
<script src="skill-data.js"></script>
<script src="skill-values.js"></script>
<script src="comparison.js"></script>
</body>
</html>
